
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pool World</title>
<style>
body{margin:0;background:#101924;color:white;font-family:Arial;text-align:center;padding:15px}
h1{color:#f4c45e}
canvas{width:100%;max-width:700px;background:#126b43;border:8px solid #87502e;border-radius:15px;box-sizing:border-box;touch-action:none}
button{background:#f4c45e;border:0;border-radius:12px;padding:17px 25px;font-size:19px;font-weight:bold;margin:8px}
input{width:85%}
</style>
</head>
<body>
<h1>🎱 POOL WORLD</h1>
<p>Prototype 0.3 - Shooting Test</p>
<canvas id="table" width="600" height="320"></canvas>
<p>Tap the table to aim. Press SHOOT!</p>
<p id="status">Ready to play</p>
<p>Shot power: <span id="powerText">55</span>%</p>
<input id="power" type="range" min="10" max="100" value="55">
<div>
<button id="shoot">🎯 SHOOT</button>
<button id="reset">↻ RACK BALLS</button>
</div>
<script>
const canvas=document.getElementById("table");
const ctx=canvas.getContext("2d");
const status=document.getElementById("status");
const power=document.getElementById("power");
const powerText=document.getElementById("powerText");
let balls=[],aim={x:1,y:0},moving=false;
const pockets=[[18,18],[300,14],[582,18],[18,302],[300,306],[582,302]];
function rack(){
balls=[{x:150,y:160,vx:0,vy:0,c:"white",cue:true}];
let colors=["#f6d12b","#1769d3","#e33137","#8039bc","#ed8422","#17834b","#752d29","#111111"];
let n=0;
for(let row=0;row<5;row++){
for(let j=0;j<=row;j++){
balls.push({x:420+row*18,y:160+(j-row/2)*21,vx:0,vy:0,c:colors[n%8]});
n++;
}}
aim={x:1,y:0};
moving=false;
status.textContent="Ready to play";
}
function draw(){
ctx.fillStyle="#126b43";ctx.fillRect(0,0,600,320);
ctx.strokeStyle="#b5a16c";ctx.lineWidth=3;ctx.strokeRect(18,18,564,284);
for(const p of pockets){
ctx.beginPath();ctx.arc(p[0],p[1],17,0,Math.PI*2);ctx.fillStyle="#080808";ctx.fill();
}
for(const b of balls){
ctx.beginPath();ctx.arc(b.x,b.y,9,0,Math.PI*2);
ctx.fillStyle=b.c;ctx.fill();
ctx.strokeStyle="#ffffff66";ctx.lineWidth=1;ctx.stroke();
}
if(!moving&&balls[0]){
const b=balls[0];
ctx.beginPath();ctx.moveTo(b.x,b.y);
ctx.lineTo(b.x+aim.x*130,b.y+aim.y*130);
ctx.strokeStyle="white";ctx.setLineDash([8,7]);ctx.lineWidth=2;ctx.stroke();ctx.setLineDash([]);
}
}
function tick(){
if(moving){
let active=false;
for(const b of balls){
b.x+=b.vx;b.y+=b.vy;
b.vx*=0.985;b.vy*=0.985;
if(b.x<27||b.x>573){b.vx*=-0.85;b.x=Math.max(27,Math.min(573,b.x));}
if(b.y<27||b.y>293){b.vy*=-0.85;b.y=Math.max(27,Math.min(293,b.y));}
if(Math.hypot(b.vx,b.vy)>0.04)active=true;
else{b.vx=0;b.vy=0;}
}
for(let i=0;i<balls.length;i++){
for(let j=i+1;j<balls.length;j++){
let a=balls[i],b=balls[j],dx=b.x-a.x,dy=b.y-a.y,d=Math.hypot(dx,dy);
if(d>0&&d<18){
let nx=dx/d,ny=dy/d,overlap=(18-d)/2;
a.x-=nx*overlap;a.y-=ny*overlap;
b.x+=nx*overlap;b.y+=ny*overlap;
let relative=(a.vx-b.vx)*nx+(a.vy-b.vy)*ny;
if(relative>0){
a.vx-=relative*nx;a.vy-=relative*ny;
b.vx+=relative*nx;b.vy+=relative*ny;
}
}
}
}
if(!active){moving=false;status.textContent="Ready for next shot";}
}
draw();
requestAnimationFrame(tick);
}
canvas.addEventListener("pointerdown",function(e){
if(moving)return;
const r=canvas.getBoundingClientRect();
let x=(e.clientX-r.left)*600/r.width;
let y=(e.clientY-r.top)*320/r.height;
let dx=x-balls[0].x,dy=y-balls[0].y;
let d=Math.hypot(dx,dy);
if(d>1){aim={x:dx/d,y:dy/d};status.textContent="Aim set! Press SHOOT";}
});
power.addEventListener("input",()=>powerText.textContent=power.value);
document.getElementById("shoot").addEventListener("click",()=>{
if(moving)return;
balls[0].vx=aim.x*Number(power.value)*0.18;
balls[0].vy=aim.y*Number(power.value)*0.18;
moving=true;
status.textContent="SHOT FIRED!";
});
document.getElementById("reset").addEventListener("click",rack);
rack();
tick();
</script>
</body>
</html>
