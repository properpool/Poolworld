name: Pool World staging gameplay tests
on:
  push:
    branches:
      - development/poolworld-match-engine
  workflow_dispatch:
jobs:
  browser-and-physics:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browser test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install playwright==1.57.0
          python -m playwright install --with-deps chromium
      - name: Check v6.0 JavaScript syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('POOL_WORLD_6.0_STAGING_MATCH.html')
          Path('pool60.js').write_text(p.read_text().split('<script>',1)[1].split('</script>',1)[0])
          PY
          node --check pool60.js
      - name: Regression and approved sound integrity
        run: python tests/test_pool60_regression.py
      - name: Mobile controls, rule edge cases and frame timing
        run: python tests/test_pool60_quality.py
      - name: Full natural-layout physical match
        run: python tests/test_pool60_match.py
      - name: Pocket jaws, cushion rebounds and energy fixtures
        run: python tests/test_pool60_pockets.py
      - name: Three varied full matches and touchscreen ball-in-hand
        run: python tests/test_pool60_varied_match.py
      - name: Spin, follow/draw and cushion English measurements
        run: python tests/test_pool60_spin.py
      - name: Visual canvas pixels and three viewports
        run: python tests/test_pool60_visual.py
      - name: Precision aim, pullback safety and landscape controls
        run: python tests/test_pool60_touch.py
      - name: Tangential spin transfer and collision energy stress
        run: python tests/test_pool60_collision.py
      - name: Bounded cushion and jaw spin transfer (4200 fixtures)
        run: python tests/test_pool60_cushion_energy.py
      - name: Shot power and six-pocket regression
        run: python tests/test_pool60_power_pot.py
      - name: True mobile touch safety and cue-ball rolling visuals
        run: python tests/test_pool60_roll_safety.py
      - name: Six-pocket corner-jaw real-touch tolerance (38 checks)
        run: python tests/test_pool60_corner_jaw_touch.py
      - name: Samsung-sized touch targets and player-style break acceptance (53 checks)
        run: python tests/test_pool60_mobile_ergonomics.py
      - name: Object-ball rolling and moving stripe visuals (16 checks)
        run: python tests/test_pool60_object_roll.py
      - name: Real-touch cut pots among scattered balls and cancelled aiming
        run: python tests/test_pool60_scattered_touch_pots.py
      - name: Foul recovery and usable SHOOT action after ball in hand
        run: python tests/test_pool60_foul_action.py
      - name: Cross-device phone tablet laptop gameplay acceptance
        run: python tests/test_pool60_cross_device.py
      - name: Keyboard foul recovery, tablet stylus and natural-rack stress
        run: python tests/test_pool60_input_recovery.py
      - name: Retry-shot power and spin restoration across devices
        run: python tests/test_pool60_retry_controls.py
      - name: Cue-ball near-touch drag continuity across four form factors
        run: python tests/test_pool60_near_cue_drag.py
      - name: Pocket-well guard, six-pocket near misses and legitimate capture
        run: python tests/test_pool60_pocket_mouth_guard.py
      - name: First cue contact in tight clustered shots (24 checks)
        run: python tests/test_pool60_first_contact.py
      - name: Clustered simultaneous collision order and energy (76 checks)
        run: python tests/test_pool60_collision_order.py
      - name: Simultaneous multi-contact symmetric split and energy (148 checks)
        run: python tests/test_pool60_simultaneous_contacts.py
      - name: Near-simultaneous staggered cluster spin and follow/draw (388 checks)
        run: python tests/test_pool60_staggered_spin_contacts.py
      - name: Rail and jaw actual-distance rolling orientation (52 checks)
        run: python tests/test_pool60_rail_roll.py
      - name: Rail-side object collisions remain inside cloth (52 checks)
        run: python tests/test_pool60_post_contact_rail.py
      - name: Rail-side two- and three-ball overlap projection (196 checks)
        run: python tests/test_pool60_rail_projection.py
      - name: High-speed clustered rail contacts and rack-order invariance (388 checks)
        run: python tests/test_pool60_cluster_stress.py
      - name: Ball-in-hand jaw clearance at all twelve rubber noses (148 checks)
        run: python tests/test_pool60_jaw_placement.py
      - name: Completed-shot rotational rest and full-turn spin recovery
        run: python tests/test_pool60_settled_spin.py
      - name: Round pool balls and accurate touch geometry on five viewports (35 checks)
        run: python tests/test_pool60_canvas_aspect.py
      - name: Interrupted aim and power pointer-capture recovery (50 checks)
        run: python tests/test_pool60_pointer_capture.py
      - name: Pocket-jaw clearance after object impacts (484 checks)
        run: python tests/test_pool60_post_contact_jaw.py
      - name: Six-ball pocket-jaw chain stress with English and draw (1444 checks)
        run: python tests/test_pool60_jaw_chain_stress.py
      - name: Measured touch power, ball travel and low-FPS simulation pacing
        run: python tests/test_pool60_power_pacing.py
      - name: Rapid-release power gesture and reversed pull regression
        run: python tests/test_pool60_quick_release.py
      - name: Idle canvas redraw cost and live aiming invalidation
        run: python tests/test_pool60_render_invalidation.py
      - name: Active full-rack render gradient allocations and frame costs
        run: python tests/test_pool60_active_render.py
      - name: Active full-rack frame CPU and contact-projection latency
        run: python tests/test_pool60_active_frame_latency.py
      - name: Moving-ball visual pacing at 60, 90 and 144 Hz
        run: python tests/test_pool60_frame_interpolation.py
      - name: Moving-ball rotation interpolation at 60, 90 and 144 Hz
        run: python tests/test_pool60_rotation_interpolation.py
      - name: Simultaneous contact allocations and real Chromium rAF diagnostics
        run: python tests/test_pool60_multicontact_allocations.py
      - name: Coalesced mobile aim release and pointer-to-render regression
        run: python tests/test_pool60_final_release_aim.py
      - name: Active physics contact-list reuse and clustered batch allocation
        run: python tests/test_pool60_contact_reuse.py
      - name: Jaw broad-phase collision scans and full-rack movement
        run: python tests/test_pool60_jaw_broadphase.py
      - name: Active ball marker allocations, rail loops and real rAF diagnostics
        run: python tests/test_pool60_active_draw_allocations.py
      - name: Active collision contact-object pooling and full-rack regression
        run: python tests/test_pool60_contact_object_pool.py
      - name: Transient frame-hitch physics time preservation and bounded catch-up
        run: python tests/test_pool60_hitch_recovery.py
      - name: Sustained low-FPS debt, real Chromium rAF and pointer-to-render latency
        run: python tests/test_pool60_sustained_frame_debt.py
      - name: Reused rail and pocket sound-event records under active physics
        run: python tests/test_pool60_sound_event_pool.py
      - name: Reusable collision audio voices and concurrent playback (60 checks)
        run: python tests/test_pool60_audio_voice_reuse.py
      - name: Six-pocket squared-distance capture and 120Hz sqrt regression
        run: python tests/test_pool60_pocket_sqrt.py
      - name: Settled-shot square-root elimination and real moving-rack rAF (60 checks)
        run: python tests/test_pool60_settled_sqrt.py
      - name: High-speed swept grazing contacts transfer real impulses (80 checks)
        run: python tests/test_pool60_swept_grazing.py
      - name: Touching cue first-hit physics and phantom foul prevention
        run: python tests/test_pool60_touching_first_hit.py
      - name: Relative touchscreen pull preserves selected shot strength
        run: python tests/test_pool60_relative_power_drag.py
      - name: Thumb touches beside narrow power slider across phone and desktop
        run: python tests/test_pool60_power_panel_touch.py
      - name: Six-pocket shallow swept capture and near-miss regression
        run: python tests/test_pool60_swept_pocket.py
      - name: Power-handle and panel-margin tap safety across four viewports
        run: python tests/test_pool60_power_tap_safety.py
      - name: Two-axis cue-side thumb aiming and shot direction (four viewports)
        run: python tests/test_pool60_fine_aim_2d.py
      - name: Sustained 10-12fps full-shot motion and 120Hz reference (four viewports)
        run: python tests/test_pool60_lowfps_motion.py
      - name: Captured off-table mouse and touch drags preserve direct cue aim
        run: python tests/test_pool60_offtable_aim_drag.py
      - name: Sustained 6-9fps cue-shot physics and isolated hitch safety (four viewports)
        run: python tests/test_pool60_sub10fps_motion.py
      - name: Sustained 13.5–14.5fps real cue motion and isolated 65–74ms hitch safety
        run: python tests/test_pool60_14fps_motion.py
      - name: Collision impulse ball-roll alignment and visible stripe skidding
        run: python tests/test_pool60_collision_roll_alignment.py
      - name: Portrait phone full-table focus, rotated touch and power safety
        run: python tests/test_pool60_portrait_focus.py
      - name: Cue guide rail occlusion and unreachable ghost-ball targets (four viewports)
        run: python tests/test_pool60_aim_guide_rail.py
      - name: Hold-to-repeat fine aiming on touch and mouse across four viewports
        run: python tests/test_pool60_fine_aim_hold.py
      - name: One-cushion bank aiming preview and pocket/ball occlusion
        run: python tests/test_pool60_bank_aim_preview.py
      - name: Cue power pullback, impact stroke and unchanged physics (four viewports)
        run: python tests/test_pool60_cue_stroke_feedback.py
      - name: Cue-ball impact visual sync at first moving frame across four viewports
        run: python tests/test_pool60_cue_impact_sync.py
      - name: BIG TABLE power thumb alignment after focus and responsive reflow
        run: python tests/test_pool60_focus_power_reflow.py
      - name: Real touchscreen foul cue-ball drag, cancel and illegal-drop safety
        run: python tests/test_pool60_ball_in_hand_drag.py
      - name: Two-finger cue aiming and pull-to-shoot release safety
        run: python tests/test_pool60_two_finger_shot.py
      - name: Foul placement reset, undo and confirm gesture safety
        run: python tests/test_pool60_placement_transition.py
      - name: Reset and UNDO cancel stale aim, power and queued multitouch shots
        run: python tests/test_pool60_gesture_transition.py
      - name: Held fine-aim gesture transaction safety across reset, undo and shoot
        run: python tests/test_pool60_fine_aim_transaction.py
      - name: Explicit SHOOT retires held aim, power and queued touchscreen gestures
        run: python tests/test_pool60_shoot_gesture_retirement.py
      - name: Near-edge coalesced cue-side and precision aim final release
        run: python tests/test_pool60_near_edge_aim_release.py
      - name: Pocketed ball sink animation and match-state integrity across four viewports
        run: python tests/test_pool60_pocket_sink_visual.py
      - name: Scratched cue ball sink measle dots fade with shell (four viewports)
        run: python tests/test_pool60_cue_scratch_fade.py
      - name: Store test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: poolworld-v60-staging-test-results
          path: |
            POOL_WORLD_6.0_*RESULTS.json
            pool60_*.png
          if-no-files-found: ignore
