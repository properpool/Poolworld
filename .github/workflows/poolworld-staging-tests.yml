name: Pool World staging gameplay tests
on:
  push:
    branches:
      - development/poolworld-match-engine
  workflow_dispatch:
jobs:
  browser-and-physics:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browser test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install playwright==1.57.0
          python -m playwright install --with-deps chromium
      - name: Check v6.0 JavaScript syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('POOL_WORLD_6.0_STAGING_MATCH.html')
          Path('pool60.js').write_text(p.read_text().split('<script>',1)[1].split('</script>',1)[0])
          PY
          node --check pool60.js
      - name: Regression and approved sound integrity
        run: python tests/test_pool60_regression.py
      - name: Mobile controls, rule edge cases and frame timing
        run: python tests/test_pool60_quality.py
      - name: Full natural-layout physical match
        run: python tests/test_pool60_match.py
      - name: Pocket jaws, cushion rebounds and energy fixtures
        run: python tests/test_pool60_pockets.py
      - name: Three varied full matches and touchscreen ball-in-hand
        run: python tests/test_pool60_varied_match.py
      - name: Spin, follow/draw and cushion English measurements
        run: python tests/test_pool60_spin.py
      - name: Visual canvas pixels and three viewports
        run: python tests/test_pool60_visual.py
      - name: Precision aim, pullback safety and landscape controls
        run: python tests/test_pool60_touch.py
      - name: Tangential spin transfer and collision energy stress
        run: python tests/test_pool60_collision.py
      - name: Bounded cushion and jaw spin transfer (4200 fixtures)
        run: python tests/test_pool60_cushion_energy.py
      - name: Shot power and six-pocket regression
        run: python tests/test_pool60_power_pot.py
      - name: True mobile touch safety and cue-ball rolling visuals
        run: python tests/test_pool60_roll_safety.py
      - name: Six-pocket corner-jaw real-touch tolerance (38 checks)
        run: python tests/test_pool60_corner_jaw_touch.py
      - name: Samsung-sized touch targets and player-style break acceptance (53 checks)
        run: python tests/test_pool60_mobile_ergonomics.py
      - name: Object-ball rolling and moving stripe visuals (16 checks)
        run: python tests/test_pool60_object_roll.py
      - name: Real-touch cut pots among scattered balls and cancelled aiming
        run: python tests/test_pool60_scattered_touch_pots.py
      - name: Store test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: poolworld-v60-staging-test-results
          path: |
            POOL_WORLD_6.0_*RESULTS.json
            pool60_*.png
          if-no-files-found: ignore
