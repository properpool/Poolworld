name: Pool World staging gameplay tests
on:
  push:
    branches:
      - development/poolworld-match-engine
  workflow_dispatch:
jobs:
  browser-and-physics:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browser test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install playwright==1.57.0
          python -m playwright install --with-deps chromium
      - name: Check v5.7 JavaScript syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('POOL_WORLD_5.7_STAGING_MATCH.html')
          Path('pool57.js').write_text(p.read_text().split('<script>',1)[1].split('</script>',1)[0])
          PY
          node --check pool57.js
      - name: Regression and approved sound integrity
        run: python tests/test_pool57_regression.py
      - name: Mobile controls, rule edge cases and frame timing
        run: python tests/test_pool57_quality.py
      - name: Full natural-layout physical match
        run: python tests/test_pool57_match.py
      - name: Pocket jaws, cushion rebounds and energy fixtures
        run: python tests/test_pool57_pockets.py
      - name: Three varied full matches and touchscreen ball-in-hand
        run: python tests/test_pool57_varied_match.py
      - name: Spin, follow/draw and cushion English measurements
        run: python tests/test_pool57_spin.py
      - name: Visual canvas pixels and three viewports
        run: python tests/test_pool57_visual.py
      - name: Precision aim, pullback safety and landscape controls
        run: python tests/test_pool57_touch.py
      - name: Store test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: poolworld-v57-staging-test-results
          path: |
            POOL_WORLD_5.7_*RESULTS.json
            pool57_*.png
          if-no-files-found: ignore