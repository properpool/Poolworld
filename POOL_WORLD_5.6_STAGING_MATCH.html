"use strict";
const canvas=document.getElementById("table"),ctx=canvas.getContext("2d"),$=id=>document.getElementById(id);
const W=1100,H=570, L=79,R=1021,T=78,B=492,rad=12.2, pocket=27, pi=Math.PI;
const holes=[[L,T],[W/2,T-8],[R,T],[L,B],[W/2,B+8],[R,B]];
// Rounded pocket jaws: fixed rubber noses at the ends of each cushion segment.
// Coordinates remain in table space; collision impulses cannot create energy.
const jawRadius=7, mouth=pocket*1.25;
const jaws=[
  ...[T,B].flatMap(y=>[[L+mouth,y],[W/2-mouth,y],[W/2+mouth,y],[R-mouth,y]]),
  ...[L,R].flatMap(x=>[[x,T+mouth],[x,B-mouth]])
];
function collideJaw(b){
  for(const [jx,jy] of jaws){
    let dx=b.x-jx,dy=b.y-jy,dist2=dx*dx+dy*dy;
    const min=rad+jawRadius;
    if(dist2>=min*min)continue;
    let d=Math.sqrt(dist2);
    if(d<1e-7){const speed=Math.hypot(b.vx,b.vy);dx=speed? -b.vx/speed:1;dy=speed? -b.vy/speed:0;d=1;}
    const nx=dx/d,ny=dy/d;
    b.x+=nx*(min-d+0.001);b.y+=ny*(min-d+0.001);
    const vn=b.vx*nx+b.vy*ny;
    if(vn<0){
      const normalImpulse=(1+.76)*vn;
      b.vx-=normalImpulse*nx;b.vy-=normalImpulse*ny;
      // Slight tangential loss on the cushion nose, never an acceleration.
      const tangent=b.vx*(-ny)+b.vy*nx;
      b.vx+=tangent*.025*ny;b.vy-=tangent*.025*nx;
      if(-vn>.06){events.push(['rail',Math.min(1,-vn/5)]);if(shot&&shot.firstHit!==null)shot.railAfterContact=true;}
    }
  }
}

const colors=['#f6f1e8','#f2d34b','#286bc4','#d34345','#6e46a5','#e98b3b','#35834a','#7b352e','#181d22','#e3c343','#275db1','#d44b55','#784e9b','#e58b35','#2d8451','#7a4032'];
let balls=[],aim=-Math.PI/2,dragAim=false,shooting=false,power=45,powerDrag=false,powerY=0,spin=0,follow=0,guide=true,history=null,events=[],lastSound={},soundOn=true;
let turn=1,groups={1:null,2:null},ballInHand=false,gameOver=false,winner=null,breakShot=true,shot=null;
const opponent=p=>p===1?2:1;
const groupOf=id=>id>=1&&id<=7?'solids':id>=9&&id<=15?'stripes':null;
const remainingFor=p=>balls.filter(b=>!b.potted&&groupOf(b.id)===groups[p]).length;
function canPlace(x,y){return Number.isFinite(x)&&Number.isFinite(y)&&x>=L+rad+2&&x<=R-rad-2&&y>=T+rad+2&&y<=B-rad-2&&!holes.some(([hx,hy])=>Math.hypot(x-hx,y-hy)<pocket+rad*.2)&&balls.every(b=>b.id===0||b.potted||Math.hypot(b.x-x,b.y-y)>=2*rad+.5)}
function cuePosition(){const x0=L+(R-L)*.24,y0=(T+B)/2;if(canPlace(x0,y0))return [x0,y0];for(let y=T+rad+6;y<=B-rad-6;y+=rad*2.3)for(let x=L+rad+6;x<=R-rad-6;x+=rad*2.3)if(canPlace(x,y))return [x,y];return [x0,y0]}
function snapshot(){return {balls:balls.map(b=>({...b})),turn,groups:{...groups},ballInHand,gameOver,winner,breakShot,aim}}
function restore(state){balls=state.balls.map(b=>({...b}));turn=state.turn;groups={...state.groups};ballInHand=state.ballInHand;gameOver=state.gameOver;winner=state.winner;breakShot=state.breakShot;aim=state.aim;shooting=false;shot=null;events.length=0;accumulator=0;updateHUD()}
function pocketBall(b){if(b.potted)return;b.potted=true;b.vx=b.vy=0;if(shot){shot.pocketed.push(b.id);if(b.id===0)shot.scratch=true}events.push(['pocket',.85])}
function resolveShot(){if(!shot)return;const s=shot;shot=null;shooting=false;for(const b of balls){b.vx=b.vy=0}
 const eight=s.pocketed.includes(8),own=groups[turn],hadPocket=s.pocketed.some(id=>id!==0);
 const eightEligible=s.targetEight??(remainingFor(turn)===0);
 const firstLegal=s.firstHit!==null&&(s.breakShot?(s.firstHit!==8):(own===null?s.firstHit!==8:(eightEligible?s.firstHit===8:groupOf(s.firstHit)===own)));
 const foul=s.scratch||!firstLegal||(!hadPocket&&!s.railAfterContact);
 if(s.breakShot&&eight){rack();$('status').textContent='8 ball on the break — rerack under Pool World house rules.';return}
 if(eight){gameOver=true;winner=!foul&&own!==null&&eightEligible&&remainingFor(turn)===0?turn:opponent(turn);$('status').textContent=`PLAYER ${winner} WINS · ${winner===turn?'legal 8-ball finish':'early or foul 8-ball'}`;updateHUD();return}
 if(!s.breakShot&&!foul&&own===null){const first=s.pocketed.find(id=>groupOf(id)!==null);if(first!==undefined){groups[turn]=groupOf(first);groups[opponent(turn)]=groups[turn]==='solids'?'stripes':'solids'}}
 const legalPocket=s.pocketed.some(id=>id!==0&&(groups[turn]===null||groupOf(id)===groups[turn]));
 if(foul||!legalPocket)turn=opponent(turn);
 if(s.scratch){const c=balls[0];c.potted=false;const [x,y]=cuePosition();c.x=x;c.y=y}if(foul)ballInHand=true
 breakShot=false;updateHUD();$('status').textContent=foul?`FOUL · Player ${turn} has ${ballInHand?'ball in hand':'the next shot'}.`:legalPocket?'Legal pot · continue your turn.':`Player ${turn} to shoot.`;
}

      b.spin*=Math.pow(.984,scale);b.follow*=Math.pow(.995,scale)}for(const [hx,hy] of holes){if(Math.hypot(b.x-hx,b.y-hy)<pocket*.74){pocketBall(b);break}}if(b.potted)continue;collideJaw(b);for(let axis of ['x','y']){let pos=b[axis],lo=axis==='x'?L+rad:T+rad,hi=axis==='x'?R-rad:B-rad;if(pos<lo||pos>hi){const closest=axis==='x'?(pos<lo?L:R):(pos<lo?T:B);const cross=axis==='x'?b.y:b.x;const nearPocket=holes.some(([hx,hy])=>axis==='x'?Math.abs(hx-closest)<1&&Math.abs(hy-cross)<pocket*1.2:Math.abs(hy-closest)<12&&Math.abs(hx-cross)<pocket*1.2);if(nearPocket){if(pos<lo-rad||pos>hi+rad){pocketBall(b)}continue}b[axis]=Math.max(lo,Math.min(hi,pos));const vel=axis==='x'?'vx':'vy';if(Math.abs(b[vel])>.06){events.push(['rail',Math.abs(b[vel])/5]);if(shot&&shot.firstHit!==null)shot.railAfterContact=true}const impact=Math.abs(b[vel]);
      // The tangential cushion impulse depends on the incoming spin and wall side.
      // Consume spin on contact and cap the speed change to prevent runaway rails.
      const wallSign=axis==='x'?(pos<lo?1:-1):(pos<lo?-1:1);
      const english=Math.max(-.45,Math.min(.45,wallSign*b.spin*impact*.11));
      b[vel]*=-.78;const tangentAxis=axis==='x'?'vy':'vx';
      b[tangentAxis]=b[tangentAxis]*.985+english;b.spin*=.68}}}
for(let i=0;i<balls.length;i++){const a=balls[i];if(a.potted)continue;for(let j=i+1;j<balls.length;j++){const b=balls[j];if(b.potted)continue;let dx=b.x-a.x,dy=b.y-a.y,d2=dx*dx+dy*dy,min=rad*2;if(d2>=min*min)continue;let d=Math.sqrt(d2);if(d<.0001){dx=min;dy=0;d=min}const nx=dx/d,ny=dy/d,overlap=min-d;const correction=overlap*.51;a.x-=nx*correction;a.y-=ny*correction;b.x+=nx*correction;b.y+=ny*correction;const rel=(b.vx-a.vx)*nx+(b.vy-a.vy)*ny;if(rel>=0)continue;if(shot&&shot.firstHit===null&&(a.id===0||b.id===0))shot.firstHit=a.id===0?b.id:a.id;const impulse=-(1+.955)*rel/2;a.vx-=impulse*nx;a.vy-=impulse*ny;b.vx+=impulse*nx;b.vy+=impulse*ny;const tx=-ny,ty=nx;const tangent=(b.vx-a.vx)*tx+(b.vy-a.vy)*ty;const fr=Math.max(-.055,Math.min(.055,tangent*.014));a.vx+=fr*tx;a.vy+=fr*ty;b.vx-=fr*tx;b.vy-=fr*ty;if(Math.abs(rel)>.11)events.push(['ball',Math.abs(rel)/5]);if(a.id===0&&Math.abs(a.follow)>.1){
       // Approximate follow/draw from the cue ball's retained longitudinal rotation.
       // A head-on draw must be able to reverse the cue after transferring momentum.
       const spinKick=Math.max(-.95,Math.min(.95,a.follow*.36));
       a.vx+=nx*spinKick;a.vy+=ny*spinKick;a.follow*=.32
      }}}
}
function settled(){return balls.every(b=>b.potted||Math.hypot(b.vx,b.vy)<.022)}
function frame(t){let elapsed=last?Math.min((t-last)/1000,.045):0;last=t;accumulator+=elapsed;let n=0;while(accumulator>=STEP&&n++<6){if(shooting)physics(STEP);accumulator-=STEP}if(shooting){for(let i=0;i<Math.min(events.length,8);i++){const [kind,v]=events[i];sound(kind,v)}events.length=0;if(settled())resolveShot()}render();requestAnimationFrame(frame)}
function shoot(){if(shooting||gameOver||ballInHand||balls[0].potted)return false;history=snapshot();shot={player:turn,breakShot,firstHit:null,railAfterContact:false,pocketed:[],scratch:false,targetEight:groups[turn]!==null&&remainingFor(turn)===0};const b=balls[0],speed=(.23+Math.pow(power/100,1.2)*5.25)*(breakShot?1.4:1);b.vx=Math.cos(aim)*speed;b.vy=Math.sin(aim)*speed;b.spin=spin/100*1.2;b.follow=follow/100*2.5;shooting=true;events.length=0;sound('cue',Math.max(.3,power/90));updateHUD();$('status').textContent='Shot in progress…';return true}
function pointerCoords(e){const r=canvas.getBoundingClientRect();return{x:(e.clientX-r.left)*W/r.width,y:(e.clientY-r.top)*H/r.height}}
let lastAim=aim;
function pointAim(e){if(shooting||gameOver||ballInHand||balls[0].potted)return;const p=pointerCoords(e),b=balls[0],a=Math.atan2(p.y-b.y,p.x-b.x);if(Math.hypot(p.x-b.x,p.y-b.y)>rad*2){aim=a;lastAim=a}}
canvas.addEventListener('pointerdown',e=>{if(shooting||gameOver)return;if(ballInHand){const p=pointerCoords(e);if(canPlace(p.x,p.y)){balls[0].x=p.x;balls[0].y=p.y;ballInHand=false;updateHUD();$('status').textContent='Cue ball placed. Aim and shoot.'}else{$('status').textContent='Invalid placement — keep the cue ball inside the cloth and clear of other balls.'}return}dragAim=true;canvas.setPointerCapture(e.pointerId);pointAim(e)});
canvas.addEventListener('pointermove',e=>{if(dragAim)pointAim(e)});
canvas.addEventListener('pointerup',()=>dragAim=false);canvas.addEventListener('pointercancel',()=>dragAim=false);
const track=$('track');
function showPower(p){power=Math.max(5,Math.min(100,p));$('strength').value=power;const h=track.clientHeight;const y=(power-5)/95*(h-22)+11;$('handle').style.top=y+'px';$('fill').style.height=y+'px'}
function padStart(e){if(shooting||gameOver||ballInHand)return;e.preventDefault();powerDrag=true;powerY=e.clientY;track.setPointerCapture(e.pointerId);const r=track.getBoundingClientRect();showPower(5+(e.clientY-r.top)/r.height*95)}
function padMove(e){if(!powerDrag)return;e.preventDefault();const r=track.getBoundingClientRect();showPower(5+(e.clientY-r.top)/r.height*95)}
function padEnd(e){if(!powerDrag)return;powerDrag=false;if(e.type==='pointerup')shoot();showPower(45)}
track.addEventListener('pointerdown',padStart);track.addEventListener('pointermove',padMove);track.addEventListener('pointerup',padEnd);track.addEventListener('pointercancel',()=>powerDrag=false);
function fineAim(direction){if(shooting||gameOver||ballInHand)return;aim+=direction*pi/360;lastAim=aim;render()}
$('aimLeft').onclick=()=>fineAim(-1);$('aimRight').onclick=()=>fineAim(1);
$('shoot').onclick=shoot;$('reset').onclick=rack;$('undo').onclick=()=>{if(!history)return;restore(history);history=null;$('status').textContent='Previous shot restored, including turns and fouls.'};
$('guide').onclick=()=>{guide=!guide;$('guide').textContent='GUIDE: '+(guide?'ON':'OFF')};$('sound').onclick=()=>{soundOn=!soundOn;$('sound').textContent=soundOn?'🔊':'🔇'};
$('strength').oninput=e=>showPower(+e.target.value);$('spin').oninput=e=>spin=+e.target.value;$('follow').oninput=e=>follow=+e.target.value;
window.addEventListener('keydown',e=>{if(e.target.tagName==='INPUT')return;if(e.code==='Space'){e.preventDefault();shoot()}if(e.code==='ArrowLeft'){aim-=.01;e.preventDefault()}if(e.code==='ArrowRight'){aim+=.01;e.preventDefault()}});
rack();showPower(45);requestAnimationFrame(frame);
</script></body></html>
